# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0
spring.jpa.open-in-view=false
# Java 21 Project Loom: Enable lightweight virtual threads for high concurrency
spring.threads.virtual.enabled=true

# Application Name
spring.application.name=MockMateAI-SpringBoot-API

# Multipart & File Upload Configuration (for Resume PDF)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# AI Keys (Configurable via Environment Variables, supporting both standard and VITE_ prefixed keys)
mockmate.ai.groq-api-key=${GROQ_API_KEY:${VITE_GROK_API_KEY:}}
mockmate.ai.gemini-api-key=${GEMINI_API_KEY:${VITE_GEMINI_API_KEY:}}

# AI Model Configuration
mockmate.ai.groq-model=${GROQ_MODEL:qwen/qwen3.8-27b}
mockmate.ai.gemini-model=gemini-1.5-flash

# Spring Data JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database DataSource (PostgreSQL-compatible H2 mode by default, overridable with Supabase PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:mockmatedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# H2 Web Console (Accessible at http://localhost:8080/h2-console for database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Keep-Alive Self-Ping Configuration (Prevents Cloud Free Tier containers from sleeping)
mockmate.keep-alive.enabled=${KEEP_ALIVE_ENABLED:true}
mockmate.keep-alive.url=${APP_BASE_URL:}

# Logging
logging.level.com.mockmate.ai=INFO
logging.level.org.springframework.web=INFO

